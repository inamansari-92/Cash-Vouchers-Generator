<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T Commodities - Voucher System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        input, select, textarea {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .voucher-list {
            margin-top: 30px;
        }

        .voucher-list h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container, .header, .main-content, .form-section, .voucher-list, .btn-actions {
                display: none;
            }

            .print-page {
                display: block !important;
            }
        }

        .print-page {
            display: none;
        }

        @page {
            size: A4;
            margin: 10mm;
        }

        .voucher-print {
            width: 48%;
            height: 48%;
            border: 2px solid #333;
            padding: 15px;
            box-sizing: border-box;
            page-break-inside: avoid;
            display: inline-block;
            vertical-align: top;
            margin: 1%;
            font-size: 11px;
        }

        .voucher-header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .voucher-header h1 {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .voucher-header .website {
            font-size: 10px;
            color: #0066cc;
        }

        .voucher-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .voucher-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 10px;
        }

        .voucher-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
            font-size: 10px;
        }

        .voucher-table th,
        .voucher-table td {
            border: 1px solid #333;
            padding: 4px;
            text-align: left;
        }

        .voucher-table th {
            background: #f0f0f0;
            font-weight: bold;
        }

        .amount-words {
            margin: 8px 0;
            font-size: 10px;
        }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 10px;
        }

        .signature-block {
            text-align: center;
            flex: 1;
        }

        .signature-line {
            border-top: 1px solid #333;
            margin-top: 30px;
            padding-top: 3px;
        }

        .stamp-box {
            text-align: center;
            margin-top: 10px;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>A.T COMMODITIES</h1>
            <p>Daily Cash Voucher Management System</p>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Create New Voucher</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Voucher Number</label>
                        <input type="number" id="voucherNo" readonly>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="voucherDate">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="voucherType">
                            <option value="payment">Payment Voucher</option>
                            <option value="receipt">Receipt Voucher</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Debit To / From</label>
                        <input type="text" id="debitTo" placeholder="Enter account name">
                    </div>
                    <div class="form-group">
                        <label>Amount (Rs)</label>
                        <input type="number" id="amount" placeholder="Enter amount" step="0.01">
                    </div>
                </div>

                <div class="form-group">
                    <label>Details</label>
                    <textarea id="details" placeholder="Enter voucher details"></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Mode of Payment</label>
                        <select id="modeOfPayment">
                            <option value="CASH">Cash</option>
                            <option value="BANK">Bank Transfer</option>
                            <option value="CHEQUE">Cheque</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Credit To</label>
                        <input type="text" id="creditTo" value="PATTY CASH">
                    </div>
                </div>

                <div class="btn-actions">
                    <button class="btn btn-primary" onclick="addVoucher()">Add Voucher</button>
                    <button class="btn btn-success" onclick="exportJSON()">Export JSON</button>
                    <button class="btn btn-warning" onclick="document.getElementById('importFile').click()">Import JSON</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
                    <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
                </div>
            </div>

            <div class="voucher-list">
                <h2>Voucher List</h2>
                <div style="margin-bottom: 15px;">
                    <label>Start printing from voucher #: </label>
                    <input type="number" id="printStartNo" min="1" style="width: 100px; margin-right: 10px;">
                    <button class="btn btn-primary btn-sm" onclick="printSelectedVouchers()">Print Selected</button>
                    <button class="btn btn-primary btn-sm" onclick="printAllVouchers()">Print All</button>
                </div>
                <table id="voucherTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Debit To</th>
                            <th>Amount (Rs)</th>
                            <th>Details</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="voucherTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="print-page" id="printArea"></div>

    <script>
        let vouchers = [];
        let nextVoucherNo = 1;

        // Initialize
        function init() {
            loadVouchers();
            updateVoucherNumber();
            setTodayDate();
        }

        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('voucherDate').value = today;
        }

        function updateVoucherNumber() {
            document.getElementById('voucherNo').value = nextVoucherNo;
        }

        function addVoucher() {
            const voucherType = document.getElementById('voucherType').value;
            const date = document.getElementById('voucherDate').value;
            const debitTo = document.getElementById('debitTo').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const details = document.getElementById('details').value;
            const modeOfPayment = document.getElementById('modeOfPayment').value;
            const creditTo = document.getElementById('creditTo').value;

            if (!date || !debitTo || !amount || !details) {
                alert('Please fill in all required fields');
                return;
            }

            const voucher = {
                no: nextVoucherNo,
                type: voucherType,
                date: date,
                debitTo: debitTo,
                amount: amount,
                details: details,
                modeOfPayment: modeOfPayment,
                creditTo: creditTo
            };

            vouchers.push(voucher);
            nextVoucherNo++;
            saveVouchers();
            updateVoucherNumber();
            clearForm();
            renderVouchers();
        }

        function clearForm() {
            document.getElementById('debitTo').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('details').value = '';
            document.getElementById('creditTo').value = 'PATTY CASH';
            setTodayDate();
        }

        function renderVouchers() {
            const tbody = document.getElementById('voucherTableBody');
            tbody.innerHTML = '';

            vouchers.forEach((voucher, index) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${voucher.no}</td>
                    <td>${formatDate(voucher.date)}</td>
                    <td>${voucher.type === 'payment' ? 'Payment' : 'Receipt'}</td>
                    <td>${voucher.debitTo}</td>
                    <td>${formatAmount(voucher.amount)}</td>
                    <td>${voucher.details}</td>
                    <td class="action-btns">
                        <button class="btn btn-primary btn-sm" onclick="printVoucher(${index})">Print</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteVoucher(${index})">Delete</button>
                    </td>
                `;
            });
        }

        function deleteVoucher(index) {
            if (confirm('Are you sure you want to delete this voucher?')) {
                vouchers.splice(index, 1);
                saveVouchers();
                renderVouchers();
            }
        }

        function printVoucher(index) {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = generateVoucherHTML(vouchers[index]);
            window.print();
        }

        function printAllVouchers() {
            if (vouchers.length === 0) {
                alert('No vouchers to print');
                return;
            }
            printMultipleVouchers(vouchers);
        }

        function printSelectedVouchers() {
            const startNo = parseInt(document.getElementById('printStartNo').value);
            if (!startNo || startNo < 1) {
                alert('Please enter a valid starting voucher number');
                return;
            }

            const selectedVouchers = vouchers.filter(v => v.no >= startNo);
            if (selectedVouchers.length === 0) {
                alert('No vouchers found from this number');
                return;
            }

            printMultipleVouchers(selectedVouchers);
        }

        function printMultipleVouchers(voucherList) {
            const printArea = document.getElementById('printArea');
            let html = '';
            
            voucherList.forEach((voucher, index) => {
                html += generateVoucherHTML(voucher);
                // Add page break after every 4 vouchers
                if ((index + 1) % 4 === 0 && index < voucherList.length - 1) {
                    html += '<div style="page-break-after: always;"></div>';
                }
            });
            
            printArea.innerHTML = html;
            window.print();
        }

        function generateVoucherHTML(voucher) {
            const typeLabel = voucher.type === 'payment' ? 'PAYMENT VOUCHER' : 'RECEIPT VOUCHER';
            const amountInWords = numberToWords(voucher.amount);
            
            return `
                <div class="voucher-print">
                    <div class="voucher-header">
                        <h1>A.T COMMODITIES</h1>
                        <div class="website">www.atcommodities.pk</div>
                    </div>
                    
                    <div class="voucher-title">${typeLabel}</div>
                    
                    <div class="voucher-info">
                        <div><strong>NO.</strong> ${voucher.no}</div>
                        <div><strong>DATE:</strong> ${formatDate(voucher.date)}</div>
                    </div>
                    
                    <table class="voucher-table">
                        <tr>
                            <th style="width: 30%;">DEBIT TO</th>
                            <td colspan="3">${voucher.debitTo}</td>
                            <th style="width: 35%;">AMOUNT IN RS</th>
                        </tr>
                        <tr>
                            <th>DETAIL</th>
                            <td colspan="3">${voucher.details}</td>
                            <td rowspan="2" style="text-align: center; vertical-align: middle; font-size: 14px;"><strong>${formatAmount(voucher.amount)}</strong></td>
                        </tr>
                        <tr>
                            <th>MODE OF PAYMENT</th>
                            <td colspan="3">${voucher.modeOfPayment}</td>
                        </tr>
                        <tr>
                            <th>CREDIT TO</th>
                            <td colspan="4">${voucher.creditTo}</td>
                        </tr>
                        <tr>
                            <th>DETAIL</th>
                            <td colspan="4">${voucher.details}</td>
                        </tr>
                    </table>
                    
                    <div class="amount-words">
                        <strong>AMOUNT IN WORDS:</strong> ${amountInWords}
                    </div>
                    
                    <div class="signatures">
                        <div class="signature-block">
                            <div><strong>PAID BY:</strong></div>
                            <div class="signature-line">INAM UR REHMAN ANSARI</div>
                        </div>
                        <div class="signature-block">
                            <div><strong>APPROVED BY:</strong></div>
                            <div class="signature-line">MR. SYED RAHAT ALI</div>
                        </div>
                    </div>
                    
                    <div class="stamp-box">STAMP</div>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = date.getDate();
            const month = date.toLocaleString('en-US', { month: 'short' });
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function formatAmount(amount) {
            return amount.toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function numberToWords(num) {
            const ones = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE'];
            const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
            const teens = ['TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];

            if (num === 0) return 'ZERO RUPEES ONLY';

            let [rupees, paisa] = num.toFixed(2).split('.').map(Number);
            let words = '';

            if (rupees >= 10000000) {
                const crores = Math.floor(rupees / 10000000);
                words += convertToWords(crores) + ' CRORE ';
                rupees %= 10000000;
            }

            if (rupees >= 100000) {
                const lakhs = Math.floor(rupees / 100000);
                words += convertToWords(lakhs) + ' LAKH ';
                rupees %= 100000;
            }

            if (rupees >= 1000) {
                const thousands = Math.floor(rupees / 1000);
                words += convertToWords(thousands) + ' THOUSAND ';
                rupees %= 1000;
            }

            if (rupees >= 100) {
                const hundreds = Math.floor(rupees / 100);
                words += ones[hundreds] + ' HUNDRED ';
                rupees %= 100;
            }

            if (rupees >= 20) {
                words += tens[Math.floor(rupees / 10)] + ' ';
                rupees %= 10;
            } else if (rupees >= 10) {
                words += teens[rupees - 10] + ' ';
                rupees = 0;
            }

            if (rupees > 0) {
                words += ones[rupees] + ' ';
            }

            words += 'RUPEES';

            if (paisa > 0) {
                words += ' AND ' + convertToWords(paisa) + ' PAISA';
            }

            return words.trim() + ' ONLY';
        }

        function convertToWords(num) {
            const ones = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE'];
            const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
            const teens = ['TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];

            if (num === 0) return '';
            if (num < 10) return ones[num];
            if (num < 20) return teens[num - 10];
            if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? ' ' + ones[num % 10] : '');
            
            return '';
        }

        function saveVouchers() {
            const data = {
                vouchers: vouchers,
                nextVoucherNo: nextVoucherNo
            };
            localStorage.setItem('voucherData', JSON.stringify(data));
        }

        function loadVouchers() {
            const saved = localStorage.getItem('voucherData');
            if (saved) {
                const data = JSON.parse(saved);
                vouchers = data.vouchers || [];
                nextVoucherNo = data.nextVoucherNo || 1;
                renderVouchers();
            }
        }

        function exportJSON() {
            const data = {
                vouchers: vouchers,
                nextVoucherNo: nextVoucherNo,
                exportDate: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vouchers_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.vouchers && Array.isArray(data.vouchers)) {
                        if (confirm('This will replace all existing vouchers. Continue?')) {
                            vouchers = data.vouchers;
                            nextVoucherNo = data.nextVoucherNo || vouchers.length + 1;
                            saveVouchers();
                            updateVoucherNumber();
                            renderVouchers();
                            alert('Vouchers imported successfully!');
                        }
                    } else {
                        alert('Invalid JSON format');
                    }
                } catch (err) {
                    alert('Error reading file: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function clearAll() {
            if (confirm('Are you sure you want to delete all vouchers? This cannot be undone.')) {
                vouchers = [];
                nextVoucherNo = 1;
                saveVouchers();
                updateVoucherNumber();
                renderVouchers();
            }
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
